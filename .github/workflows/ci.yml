name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both supported typeorm major lines (peerDependencies range)
        typeorm-version: ['^0.3.20', '^1.0.0']
    name: build (typeorm ${{ matrix.typeorm-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (yarn 4 via packageManager field)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Use typeorm ${{ matrix.typeorm-version }}
        run: yarn add -D 'typeorm@${{ matrix.typeorm-version }}'

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test --passWithNoTests

      - name: Verify package contents
        run: yarn pack --dry-run
